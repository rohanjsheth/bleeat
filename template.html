<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>blee.eat</title>
<meta name="theme-color" content="#87CEEB">
<meta property="og:title" content="blee.eat">
<meta property="og:type" content="website">
<meta property="og:url" content="https://blee.eat/">
<meta property="og:image" content="https://blee.eat/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="blee.eat">
<meta name="twitter:image" content="https://blee.eat/preview.png">
<link rel="icon" type="image/png" href="data:image/png;base64,__FAV__">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* Same type as simin.eat: Crumbl Sans if installed, Outfit as the free lookalike.
*/
  :root{
    --sky:#87CEEB;
    --ink:#000;
    --font:"CrumblSansFont","Crumbl Sans","Outfit",ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--sky);
    font-family:var(--font);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  .stage{
    position:fixed;inset:0 0 calc(118px + env(safe-area-inset-bottom)) 0;
    display:flex;align-items:center;justify-content:center;
    padding:44px 10px 0;
  }
  .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
  .eating .bob{animation-play-state:paused}
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-1.2deg)}
    50%{transform:translateY(-8px) rotate(1.2deg)}
  }
  .sticker{
    position:relative;cursor:pointer;
    height:min(calc((100vh - 180px - env(safe-area-inset-bottom)) * .72), calc((100vw - 20px) * .8 * __AR__));
    height:min(calc((100dvh - 180px - env(safe-area-inset-bottom)) * .72), calc((100vw - 20px) * .8 * __AR__));
    aspect-ratio:__W__/__H__;
    filter:drop-shadow(0 14px 22px rgba(20,80,130,.30)) drop-shadow(0 2px 3px rgba(0,0,0,.12));
    transform-origin:70% 60%;
  }
  .sticker img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
  #jaw{will-change:transform}

  .feed{
    position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    font-family:var(--font);font-weight:800;font-size:30px;letter-spacing:-.01em;
    color:#fff;background:var(--ink);border:0;border-radius:999px;
    padding:14px 46px 16px;cursor:pointer;z-index:8;
    box-shadow:0 6px 0 rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .feed:hover{transform:translateX(-50%) translateY(-2px)}
  .feed:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}

  .bob{position:relative}
  /* the belly warp is drawn into this canvas (WebGL); it overhangs the sticker so the belly can bulge out */
  .warp{position:absolute;left:-30%;top:-20%;width:142%;height:145%;pointer-events:none;display:none}
  .sticker.gl .warp{display:block}
  .sticker.gl img{opacity:0}
  .counter{position:absolute;left:50%;top:1%;transform:translate(-50%,-30%) rotate(-4deg);
    z-index:9;pointer-events:none;white-space:nowrap;text-align:center;
    font-family:var(--font);font-weight:900;font-size:40px;line-height:1;
    color:#fff;-webkit-text-stroke:.16em #000;paint-order:stroke fill;text-shadow:0 4px 0 #000;
    font-variant-numeric:tabular-nums}
  .counter span{display:inline-block}

  .mute{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:10;
    width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.85);color:#fff;
    display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mute svg{width:22px;height:22px}
  .mute .off{display:none} .mute.muted .on{display:none} .mute.muted .off{display:block}

  #tuft{position:fixed;left:0;top:0;pointer-events:none;z-index:5;opacity:0;
    filter:drop-shadow(0 10px 14px rgba(20,80,130,.28))}
  .bit{position:fixed;left:0;top:0;pointer-events:none;z-index:6;border-radius:40% 40% 50% 50%}
  .nom{position:fixed;left:0;top:0;z-index:7;pointer-events:none;
    font-family:var(--font);font-weight:900;color:#000;white-space:nowrap}
  .cal{position:fixed;left:0;top:0;z-index:8;pointer-events:none;white-space:nowrap;
    font-family:var(--font);font-weight:900;color:#fff;letter-spacing:-.01em;
    -webkit-text-stroke:.16em #000;paint-order:stroke fill;
    text-shadow:0 3px 0 #000}
  .bleat{position:fixed;left:0;top:0;z-index:8;pointer-events:none;white-space:nowrap;
    font-family:var(--font);font-weight:900;color:#fff;letter-spacing:.02em;
    -webkit-text-stroke:.16em #000;paint-order:stroke fill;text-shadow:0 4px 0 #000}

</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bob">
      <div class="sticker" id="sticker" role="button" aria-label="Poke the sheep">
        <img id="base" alt="" src="data:image/webp;base64,__BASE__">
        <img id="jaw" alt="" src="data:image/webp;base64,__JAW__">
        <canvas id="warp" class="warp"></canvas>
      </div>
      <div class="counter" id="counter"><span id="calnum">0</span> cal</div>
    </div>
  </div>
  <canvas id="tuft" width="480" height="480"></canvas>
  <button class="feed" id="feed">feed</button>
  <button class="mute" id="mute" aria-label="Toggle sound">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>

<script>
/* sounds: "Sheep Baa" by AntumDeluge from a recording by mikewest (CC0, OpenGameArt)
           "Crunchy bite" (CC0, OpenGameArt) */
(() => {
  const SW = __W__, SH = __H__;
  const MX = __MX__, MY = __MY__;        // mouth, as a fraction of the sticker
  const OPEN = 2.4, WIDE = 3.6;          // jaw drop, % of sticker height
  const CAL_PER_BITE = 6;                // it's grass. sheep is on a diet.
  const FAT_PER_BITE = .035, FAT_PER_MEAL = .05, FAT_MAX = .78;   // belly bulge strength (0 = normal)
  const BITES = [150, 235, 315, 400];    // tuft canvas y of each bite, top to bottom

  const stage = document.getElementById('stage');
  const sticker = document.getElementById('sticker');
  const jaw = document.getElementById('jaw');
  const btn = document.getElementById('feed');
  const cv = document.getElementById('tuft');
  const ctx = cv.getContext('2d');
  const tuftImg = new Image();
  tuftImg.src = 'data:image/webp;base64,__TUFT__';
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  let jawPos = 0, busy = false, queued = 0;

  // ---------- belly warp ----------
  // The sticker is redrawn in WebGL with a bulge centred on the belly. Every bite pushes it a bit
  // further, so the sheep swells and its belly sags out of the sticker; it jiggles when it settles.
  // The head sits near the bulge's rim, so the face barely moves. No WebGL → plain sticker, no bulge.
  const PAD = [.30, .20, .12, .25];       // warp canvas overhang: left, top, right, bottom (sticker units)
  const BC = [.35, .75], BR = [.68, .52]; // bulge centre and radius (sticker units)
  let gl = null, fat = 0, wob = 0, wobT = 0;
  function amtNow(){
    const t = (performance.now() - wobT) / 1000;
    return Math.max(0, fat + wob * Math.sin(t * 17) * Math.exp(-t * 3.2));
  }
  function jiggle(a){ if (gl){ wob = a; wobT = performance.now(); } }
  function fatten(d){ if (gl) fat = Math.min(FAT_MAX, fat + d); }
  const warpF = (p, a) => {
    const dx = (p[0]-BC[0])/BR[0], dy = (p[1]-BC[1])/BR[1], r2 = dx*dx + dy*dy;
    if (r2 >= 1) return 1; const k = 1 - r2; return 1 - a*k*k;
  };
  // where a point of the original sticker shows up after the warp (fixed-point inverse)
  function onScreen(src){
    if (!gl || fat === 0) return src;
    let p = src;
    for (let i = 0; i < 24; i++){ const f = warpF(p, fat); p = [BC[0] + (src[0]-BC[0])/f, BC[1] + (src[1]-BC[1])/f]; }
    return p;
  }
  (async function initWarp(){
    try {
      const c = document.getElementById('warp');
      const g = c.getContext('webgl', {premultipliedAlpha:true, alpha:true, antialias:false});
      if (!g) return;
      const sh = (type, src) => { const s = g.createShader(type); g.shaderSource(s, src); g.compileShader(s);
        if (!g.getShaderParameter(s, g.COMPILE_STATUS)) throw g.getShaderInfoLog(s); return s; };
      const prog = g.createProgram();
      g.attachShader(prog, sh(g.VERTEX_SHADER,
        'attribute vec2 p; varying vec2 v; void main(){ v = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p, 0., 1.); }'));
      g.attachShader(prog, sh(g.FRAGMENT_SHADER, `precision mediump float;
        varying vec2 v; uniform sampler2D B, J; uniform vec4 P; uniform vec2 C, R; uniform float A, JY;
        vec4 tx(sampler2D t, vec2 s){ return (s.x < 0. || s.x > 1. || s.y < 0. || s.y > 1.) ? vec4(0.) : texture2D(t, s); }
        void main(){
          vec2 q = vec2(-P.x + v.x*(1. + P.x + P.z), -P.y + v.y*(1. + P.y + P.w));
          vec2 d = (q - C) / R; float k = max(0., 1. - dot(d, d));
          vec2 s = C + (q - C) * (1. - A*k*k);
          vec4 b = tx(B, s), j = tx(J, s - vec2(0., JY));
          gl_FragColor = j + b*(1. - j.a);
        }`));
      g.linkProgram(prog);
      if (!g.getProgramParameter(prog, g.LINK_STATUS)) throw g.getProgramInfoLog(prog);
      g.useProgram(prog);
      const buf = g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER, buf);
      g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), g.STATIC_DRAW);
      const loc = g.getAttribLocation(prog, 'p'); g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
      g.pixelStorei(g.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      const tex = async (img, unit) => {
        if (img.decode) { try { await img.decode(); } catch(e){} }
        if (!img.complete || !img.naturalWidth) await new Promise(r => img.addEventListener('load', r, {once:true}));
        const t = g.createTexture(); g.activeTexture(g.TEXTURE0 + unit); g.bindTexture(g.TEXTURE_2D, t);
        g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE); g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
        g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR); g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
        g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, g.RGBA, g.UNSIGNED_BYTE, img);
      };
      await tex(document.getElementById('base'), 0);
      await tex(jaw, 1);
      const U = n => g.getUniformLocation(prog, n);
      g.uniform1i(U('B'), 0); g.uniform1i(U('J'), 1);
      g.uniform4f(U('P'), ...PAD); g.uniform2f(U('C'), ...BC); g.uniform2f(U('R'), ...BR);
      const uA = U('A'), uJY = U('JY');
      g.enable(g.BLEND); g.blendFunc(g.ONE, g.ONE_MINUS_SRC_ALPHA);
      gl = g;
      sticker.classList.add('gl');
      (function draw(){
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.round(c.clientWidth*dpr), h = Math.round(c.clientHeight*dpr);
        if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
        g.viewport(0, 0, w, h); g.clearColor(0, 0, 0, 0); g.clear(g.COLOR_BUFFER_BIT);
        // the jaw is still animated on the (hidden) <img>; read its offset each frame
        let jy = 0; const m = getComputedStyle(jaw).transform;
        if (m && m !== 'none'){ const n = m.match(/matrix(3d)?\(([^)]+)\)/);
          if (n){ const a = n[2].split(',').map(Number); jy = (n[1] ? a[13] : a[5]) / (jaw.offsetHeight || 1); } }
        g.uniform1f(uA, amtNow()); g.uniform1f(uJY, jy);
        g.drawArrays(g.TRIANGLES, 0, 3);
        requestAnimationFrame(draw);
      })();
    } catch(e){ gl = null; sticker.classList.remove('gl'); }
  })();

  function resetTuft(){
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, 480, 480);
    ctx.drawImage(tuftImg, 0, 0, 480, 480);
  }
  function moveJaw(to, ms, easing='ease-out'){
    const a = jaw.animate([{transform:`translateY(${jawPos}%)`},{transform:`translateY(${to}%)`}],
      {duration:ms, easing, fill:'forwards'});
    jawPos = to; return a.finished;
  }
  function geom(){
    const r = sticker.getBoundingClientRect();
    const m = onScreen([MX, MY]);
    return { r, mx:r.left + r.width*m[0], my:r.top + r.height*m[1], size:r.width*0.3 };
  }
  // tuft transform: centre at (x,y), scale s, rotation deg
  const tf = (g,x,y,s,rot=0) => `translate(${x-g.size/2}px,${y-g.size/2}px) scale(${s}) rotate(${rot}deg)`;
  // tuft centre so that bite row k sits right at the mouth
  const atMouth = (g,k) => ({ x:g.mx, y:g.my + (240 - BITES[k]) * g.size/480 + g.size*0.02 });
  let tuftT = '';
  function moveTuft(g, to, ms, easing='ease-out'){
    const a = cv.animate([{transform:tuftT || to},{transform:to}], {duration:ms, easing, fill:'forwards'});
    tuftT = to; return a.finished;
  }

  // chomp a scalloped bite out of the top of what's left
  function bite(k){
    if (k === BITES.length - 1){ ctx.clearRect(0,0,480,480); return; }
    const y = BITES[k];
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.rect(0, 0, 480, y - 6); ctx.fill();
    for (let x = 40; x <= 440; x += 44){
      ctx.beginPath(); ctx.arc(x + rand(-6,6), y + rand(-4,10), rand(22,30), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // little grass bits falling from the mouth
  const GREENS = ['#3f9a2c','#5fbf3a','#2f7f24','#7fd04a'], DIRT = ['#4a3324','#3a281c','#5c4130','#2e2017'];
  function bits(x, y, n, scale, k=0){
    for (let i=0;i<n;i++){
      const d = document.createElement('div'); d.className = 'bit';
      const w = rand(3,6)*scale, h = rand(10,20)*scale;
      d.style.width = w+'px'; d.style.height = h+'px';
      const dirt = k >= 2 && i % 2 === 0;
      d.style.background = dirt ? DIRT[i % DIRT.length] : GREENS[i % GREENS.length];
      if (dirt){ d.style.height = w*1.1+'px'; d.style.borderRadius = '45%'; }
      document.body.appendChild(d);
      const dx = rand(-70,70)*scale, dy = rand(90,190)*scale, r0 = rand(0,360), r1 = r0 + rand(-260,260);
      d.animate([
        {transform:`translate(${x}px,${y}px) rotate(${r0}deg)`, opacity:1},
        {transform:`translate(${x+dx*.6}px,${y-24*scale}px) rotate(${(r0+r1)/2}deg)`, opacity:1, offset:.3},
        {transform:`translate(${x+dx}px,${y+dy}px) rotate(${r1}deg)`, opacity:0}
      ], {duration:rand(650,950), easing:'cubic-bezier(.3,.1,.6,1)'}).finished.then(()=>d.remove());
    }
  }

  const NOMS = ['nom','nom','NOM','NOM!!'];
  function nomText(g, i){
    const el = document.createElement('div'); el.className = 'nom'; el.textContent = NOMS[i];
    const fs = Math.max(26, g.r.width*0.085)*[1,1.05,1.25,1.5][i];
    el.style.fontSize = fs + 'px';
    document.body.appendChild(el);
    const w = el.offsetWidth, side = i%2 ? -1 : 1;
    let x = g.mx + side*g.r.width*0.36 - (side<0 ? w : 0);
    x = Math.min(innerWidth - w - 10, Math.max(10, x));
    const y = g.my - g.r.height*0.08 - (i===3 ? fs*0.3 : 0);
    const rot = side*(8 + Math.random()*8);
    el.animate([
      {transform:`translate(${x}px,${y}px) scale(.3) rotate(${rot}deg)`, opacity:0},
      {transform:`translate(${x}px,${y-20}px) scale(1.1) rotate(${rot}deg)`, opacity:1, offset:.25},
      {transform:`translate(${x}px,${y-50}px) scale(1) rotate(${rot}deg)`, opacity:0}
    ], {duration:i===3 ? 1100 : 900, easing:'ease-out'}).finished.then(()=>el.remove());
  }
  // "+6 cal" pops, same as simin.eat's
  function calPop(g, n, i){
    const el = document.createElement('div'); el.className = 'cal';
    el.textContent = `+${n} cal`;
    const fs = Math.max(24, g.r.width*0.075);
    el.style.fontSize = fs + 'px';
    document.body.appendChild(el);
    const w = el.offsetWidth, side = i%2 ? 1 : -1;
    const x = Math.min(innerWidth - w - 10, Math.max(10, g.mx + side*g.r.width*0.30 - w/2)), y = g.my + g.r.height*0.02;
    el.animate([
      {transform:`translate(${x}px,${y}px) scale(.4)`, opacity:0},
      {transform:`translate(${x}px,${y-30}px) scale(1.12)`, opacity:1, offset:.2},
      {transform:`translate(${x}px,${y-40}px) scale(1)`, opacity:1, offset:.7},
      {transform:`translate(${x}px,${y-90}px) scale(.95)`, opacity:0}
    ], {duration:1400, easing:'ease-out'}).finished.then(()=>el.remove());
  }

  // ---------- calorie counter ----------
  const counter = document.getElementById('counter');
  const calnum = document.getElementById('calnum');
  let eaten = 0, shown = 0, tweenId = 0;
  function addCals(n){
    eaten += n;
    const from = shown, to = eaten, t0 = performance.now(), dur = 650, id = ++tweenId;
    calnum.animate([{transform:'scale(1)'},{transform:'scale(1.25) rotate(-3deg)'},{transform:'scale(1)'}],
      {duration:350, easing:'ease-out'});
    (function step(now){
      if (id !== tweenId) return;
      const p = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-p, 3);
      shown = Math.round(from + (to-from)*e);
      calnum.textContent = shown.toLocaleString('en-US');
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }
  const sizeCounter = () => counter.style.fontSize = Math.max(30, sticker.offsetWidth*0.12) + 'px';
  sizeCounter(); addEventListener('resize', sizeCounter);

  // ---------- sounds ----------
  let actx = null, muted = false;
  try { muted = localStorage.getItem('blee-muted') === '1'; } catch(e) {}
  const muteBtn = document.getElementById('mute');
  muteBtn.classList.toggle('muted', muted);
  muteBtn.addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; muteBtn.classList.toggle('muted', muted);
    try { localStorage.setItem('blee-muted', muted ? '1' : '0'); } catch(e) {}
    if (!muted) { ac(); blip(880, 1320, .09, .12, 'sine'); }
  });
  function ac(){
    if (muted) return null;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch(e) { return null; }
  }
  function blip(f1, f2, dur, vol=.2, type='triangle', delay=0){
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const SAMPLES = { bite:'data:audio/mpeg;base64,__BITE__', bleat:'data:audio/mpeg;base64,__BLEAT__' };
  const decoded = {};
  function load(name){
    const a = ac(); if (!a) return Promise.resolve(null);
    if (!decoded[name]) decoded[name] = fetch(SAMPLES[name]).then(r => r.arrayBuffer())
      .then(b => new Promise((res, rej) => a.decodeAudioData(b, res, rej))).catch(() => null);
    return decoded[name];
  }
  async function play(name, rate=1, vol=1){
    const a = ac(); if (!a) return;
    const buf = await load(name); if (!buf || muted) return;
    const s = a.createBufferSource(), g = a.createGain();
    s.buffer = buf; s.playbackRate.value = rate; g.gain.value = vol;
    s.connect(g).connect(a.destination); s.start();
  }
  // warm up audio + decode on the first touch so the first sound isn't late
  addEventListener('pointerdown', () => { load('bite'); load('bleat'); }, { once:true });
  const BITE_RATE = [1.0, 1.06, 1.13, 1.22];
  const sfx = {
    fly(){ blip(500, 1400, .28, .07, 'sine'); },
    nom(k){ play('bite', BITE_RATE[k], k===3 ? 1 : .85); },
    gulp(){ blip(700, 260, .16, .16, 'sine'); },
    yay(){ [1046.5, 1318.5, 1568, 2093].forEach((f,i) => blip(f, f*1.01, .16, .07, 'sine', i*.07)); },
    bleat(){ play('bleat', rand(.94, 1.1), .9); }
  };

  // ---------- feeding ----------
  async function feedOnce(){
    busy = true;
    stage.classList.add('eating');
    resetTuft();
    let g = geom();
    cv.style.width = cv.style.height = g.size + 'px';
    const b = btn.getBoundingClientRect();
    const sx = b.left + b.width/2, sy = b.top;
    const p = atMouth(g, 0);
    tuftT = tf(g, sx, sy, .3, -18);
    cv.style.transform = tuftT; cv.style.opacity = 1;
    sfx.fly();
    await moveTuft(g, tf(g, p.x, p.y + g.size*.25, 1, 6), 520, 'cubic-bezier(.2,.8,.3,1)');

    for (let k = 0; k < BITES.length; k++){
      g = geom();
      const q = atMouth(g, k);
      // lean in while the jaw opens
      moveJaw(OPEN * (k === 3 ? 1.25 : 1), 150);
      await moveTuft(g, tf(g, q.x, q.y, 1, k % 2 ? -4 : 4), 170, 'ease-out');
      // chomp
      await moveJaw(0, 85, 'ease-in');
      bite(k); sfx.nom(k); nomText(g, k); calPop(g, CAL_PER_BITE, k); addCals(CAL_PER_BITE);
      bits(g.mx, g.my + g.r.height*.03, 7, g.r.width/600, k);
      fatten(FAT_PER_BITE); jiggle(.08);
      sticker.animate([{transform:'scale(1)'},{transform:'scale(1.025,.975)'},{transform:'scale(1)'}],{duration:180});
      // tug back a little
      await moveTuft(g, tf(g, q.x, q.y + g.size*.07, 1, 0), 140, 'ease-out');
      await wait(110);
    }
    cv.style.opacity = 0;

    // swallow + chew
    sfx.gulp();
    for (let i = 0; i < 4; i++){ await moveJaw(1.1, 95); await moveJaw(0, 95, 'ease-in'); }
    // all done: belly settles, then BLEEEAT
    fatten(FAT_PER_MEAL);
    await wait(450);
    await doBleat();
    busy = false;
  }
  async function feed(){
    ac(); load('bite'); load('bleat');
    if (busy){ queued = Math.min(queued + 1, 5); return; }
    busy = true;
    if (bleatP) await bleatP;          // let a poke-bleat finish first
    await feedOnce();
    while (queued > 0){ queued--; await feedOnce(); }
  }

  // ---------- poke → BLEEEAT ----------
  // BLEEEAT: same style and wobble as simin.eat's BURP
  function bubble(){
    const g = geom();
    const el = document.createElement('div'); el.className = 'bleat';
    el.textContent = 'BLEE' + 'E'.repeat(Math.floor(rand(0, 3))) + 'AT!';
    const fs = Math.max(34, g.r.width*0.13); el.style.fontSize = fs + 'px';
    document.body.appendChild(el);
    const w = el.offsetWidth;
    const x = Math.min(innerWidth - w - 10, Math.max(10, g.mx - w - g.r.width*0.1)), y = g.my - g.r.height*0.12;
    el.animate([
      {transform:`translate(${x}px,${y+30}px) scale(.3) rotate(-10deg)`, opacity:0},
      {transform:`translate(${x}px,${y}px) scale(1.15) rotate(6deg)`, opacity:1, offset:.18},
      {transform:`translate(${x+4}px,${y-4}px) scale(1) rotate(-5deg)`, opacity:1, offset:.35},
      {transform:`translate(${x-4}px,${y-8}px) scale(1) rotate(5deg)`, opacity:1, offset:.5},
      {transform:`translate(${x}px,${y-60}px) scale(1) rotate(0deg)`, opacity:0}
    ], {duration:1300, easing:'ease-out'}).finished.then(()=>el.remove());
  }
  let bleating = false, bleatP = null;
  function bleat(){
    if (busy || bleating) return;
    bleatP = doBleat().then(() => { bleatP = null; });
  }
  async function doBleat(){
    bleating = true;
    stage.classList.add('eating');
    sfx.bleat();
    bubble();
    if (fat > 0) jiggle(.1);
    sticker.animate([
      {transform:'rotate(0) scale(1)'},
      {transform:'rotate(-2.5deg) scale(1.04,.97)', offset:.12},
      {transform:'rotate(2deg) scale(1.03)', offset:.3},
      {transform:'rotate(-1.5deg) scale(1.03)', offset:.5},
      {transform:'rotate(1deg) scale(1.02)', offset:.7},
      {transform:'rotate(0) scale(1)'}
    ], {duration:800, easing:'ease-out'});
    // jaw quivers like a real baa
    const kf = [0, WIDE, WIDE*.72, WIDE, WIDE*.75, WIDE*.95, WIDE*.7, WIDE*.9, 0].map(v => ({transform:`translateY(${v}%)`}));
    await jaw.animate(kf, {duration:820, easing:'ease-in-out', fill:'forwards'}).finished;
    jawPos = 0;
    stage.classList.remove('eating');
    bleating = false;
  }

  btn.addEventListener('click', feed);
  sticker.addEventListener('click', () => { ac(); bleat(); });
  addEventListener('keydown', e => {
    if (e.code === 'Space'){ e.preventDefault(); feed(); }
    if (e.key === 'b' || e.key === 'B') bleat();
  });
})();
</script>
